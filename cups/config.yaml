ports_description:
  631/tcp: CUPS web interface and IPP (host networking; fixed port)
watchdog: "tcp://[HOST]:[PORT:631]"
webui: "https://[HOST]:[PORT:631]"
options:
  admin_password: ""
schema:
  admin_password: password
