name: CUPS HP Color Laser 150
version: "0.1.1"
slug: cups_hp150
description: CUPS 2.4 with HP's official USB Color Laser 15x driver
url: https://github.com/Deluka-BE/haos-cups-hp150
arch:
  - amd64
  - aarch64
startup: services
boot: auto
init: false
usb: true
host_network: true
ports:
